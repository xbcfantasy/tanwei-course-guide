<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>选课指导 - 探微书院2026选课助手</title>
  <meta name="description" content="通过喜好问卷生成探微书院2026级个性化选课建议：必选课程、限选模块、任选推荐与学分规划。">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236610f2'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>探</text></svg>">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <span class="brand-logo">探</span>
        <span>探微书院2026选课助手<small>Tanwei Course Guide</small></span>
      </a>
      <nav class="nav">
        <a href="index.html" data-nav="home">首页</a>
        <a href="guide.html" data-nav="guide" class="active">选课指导</a>
        <a href="pyfa.html" data-nav="pyfa">培养方案</a>
        <a href="courses.html" data-nav="courses">课程库</a>
      </nav>
    </div>
  </header>

  <div class="wrap">
    <!-- ============ 问卷步骤 ============ -->
    <div id="quizView">
      <div class="card" style="max-width:760px;margin:0 auto">
        <div class="quiz-progress"><div id="quizBar" style="width:14%"></div></div>
        <div class="step-dots" id="stepDots"></div>
        <div id="quizSteps"></div>
        <div class="quiz-nav">
          <button class="btn btn-soft" id="btnPrev" onclick="quiz.prev()">← 上一步</button>
          <span class="small" id="stepLabel">1 / 7</span>
          <button class="btn btn-primary" id="btnNext" onclick="quiz.next()">下一步 →</button>
        </div>
      </div>
    </div>

    <!-- ============ 推荐结果 ============ -->
    <div id="resultView" style="display:none">
      <div id="resultHeader"></div>
      <div id="resultBody"></div>
      <div class="card" style="text-align:center">
        <button class="btn btn-outline" onclick="quiz.restart()">↺ 重新填写问卷</button>
        <a class="btn btn-primary" href="courses.html" style="margin-left:10px">🔍 去课程库自己搜</a>
      </div>
    </div>
  </div>

  <footer class="footer"></footer>

  <script src="js/common.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/recommend.js"></script>
  <script src="js/guide.js"></script>
</body>
</html>
